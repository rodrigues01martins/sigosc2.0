# INV-PREP-02C — Diagnostico ISOLADO das declaracoes do token OIDC do GitHub Actions.
#
# Comprova os atributos que o GitHub emite para um job com o ambiente protegido inv-uxpt-01, SEM
# autenticar no Google Cloud (sem STS, sem google-github-actions/auth, sem conta de servico, sem
# Firestore). O token e pedido com publico EXCLUSIVO de diagnostico e examinado so em memoria.
# Procedimento: docs/uxpt/INV-PREP-02C-diagnostico.md.
#
# Disparo EXCLUSIVO: push no develop alterando ops/inventory/oidc-diagnostic-trigger.txt. Esse arquivo
# NAO existe na preparacao (INV-PREP-02C.1); cria-lo exige autorizacao expressa e commit proprio.
# Este workflow e independente do workflow de inventario (inv-uxpt-01.yml), que nao e alterado.

name: INV-UXPT OIDC diagnostico isolado

on:
  push:
    branches:
      - develop
    paths:
      - ops/inventory/oidc-diagnostic-trigger.txt

permissions:
  contents: read

concurrency:
  group: inv-uxpt-oidc-diagnostic
  cancel-in-progress: false

jobs:
  guard:
    name: Validacoes sem token
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validar repositorio, branch, evento e habilitacao administrativa
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          FORCED: ${{ github.event.forced }}
          ENABLED: ${{ vars.INV_UXPT_OIDC_DIAG_ENABLED }}
          APPROVED_BASE: ${{ vars.INV_UXPT_OIDC_DIAG_APPROVED_BASE_SHA }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$REPOSITORY" = "rodrigues01martins/sigosc2.0" ] || fail "repositorio nao autorizado"
          [ "$REF" = "refs/heads/develop" ] || fail "branch nao autorizado"
          [ "$EVENT" = "push" ] || fail "evento nao autorizado"
          [ "$FORCED" != "true" ] || fail "push forcado nao e aceito"
          [ "$ENABLED" = "true" ] || fail "diagnostico nao habilitado administrativamente (INV_UXPT_OIDC_DIAG_ENABLED)"
          [[ "$APPROVED_BASE" =~ ^[0-9a-f]{40}$ ]] || fail "commit revisado do diagnostico nao informado (INV_UXPT_OIDC_DIAG_APPROVED_BASE_SHA)"
          echo "Contexto validado."

      - name: Checkout do commit de disparo (sem credenciais persistidas)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validar que o disparo altera somente o arquivo de disparo sobre a base revisada
        env:
          SHA: ${{ github.sha }}
          APPROVED_BASE: ${{ vars.INV_UXPT_OIDC_DIAG_APPROVED_BASE_SHA }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$SHA" ] || fail "checkout diferente do commit de disparo"
          [ "$(git rev-list --parents -n 1 HEAD | wc -w)" = "2" ] || fail "commit de disparo deve ter exatamente um pai (sem merge)"
          [ "$(git rev-parse HEAD^)" = "$APPROVED_BASE" ] || fail "o commit de disparo nao parte do commit revisado do diagnostico"
          [ "$(git diff --name-only HEAD^ HEAD)" = "ops/inventory/oidc-diagnostic-trigger.txt" ] || fail "o commit de disparo altera outros arquivos (inclusive workflow ou script)"
          if [ ! -f ops/inventory/oidc-diagnostic-trigger.txt ] || [ -L ops/inventory/oidc-diagnostic-trigger.txt ]; then fail "o arquivo de disparo deve existir como arquivo comum"; fi
          [ "$(wc -c < ops/inventory/oidc-diagnostic-trigger.txt)" -le 1024 ] || fail "arquivo de disparo acima de 1 KB"
          echo "Commit de disparo validado."

  oidc-claims:
    name: Diagnostico das declaracoes OIDC (sem Google Cloud)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: inv-uxpt-01
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout do commit validado (sem credenciais persistidas)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Revalidar o commit e a base revisada
        env:
          SHA: ${{ github.sha }}
          APPROVED_BASE: ${{ vars.INV_UXPT_OIDC_DIAG_APPROVED_BASE_SHA }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ]
          [ "$(git rev-parse HEAD^)" = "$APPROVED_BASE" ]
          [ "$(git diff --name-only HEAD^ HEAD)" = "ops/inventory/oidc-diagnostic-trigger.txt" ]

      - name: Node.js compativel com o projeto
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'

      # Sem npm ci: o diagnostico e seus testes usam somente modulos nativos do Node.
      - name: Testes offline do diagnostico (antes de solicitar o token)
        run: node --test tests/inventory-oidc/oidc-claims-diagnostic.test.mjs

      # Codigos: 0 todos PASS; 1 algum FAIL; 4 algum NOT_VERIFIABLE; 2 token indisponivel; 3 configuracao recusada.
      - name: Diagnostico das declaracoes (token somente em memoria)
        id: diagnostic
        env:
          INV_UXPT_EXPECTED_REPOSITORY_ID: ${{ vars.INV_UXPT_EXPECTED_REPOSITORY_ID }}
          INV_UXPT_EXPECTED_OWNER_ID: ${{ vars.INV_UXPT_EXPECTED_OWNER_ID }}
        run: |
          set +e
          node scripts/inventory/oidc-claims-diagnostic.mjs --out "$RUNNER_TEMP/oidc-diagnostic"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Resumo (somente situacoes por atributo)
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/oidc-diagnostic/oidc-diagnostic.md" ]; then cat "$RUNNER_TEMP/oidc-diagnostic/oidc-diagnostic.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Resultado (falha se algum atributo nao passar)
        if: always()
        env:
          RC: ${{ steps.diagnostic.outputs.rc }}
        run: |
          set -euo pipefail
          [ "$RC" = "0" ] || { echo "::error::diagnostico OIDC nao aprovado (codigo ${RC:-ausente})"; exit 1; }
