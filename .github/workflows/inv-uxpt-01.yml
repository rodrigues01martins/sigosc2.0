# INV-UXPT-01 — Inventário SOMENTE LEITURA dos estados legados do Plano de Trabalho (Firebase de testes).
#
# Workflow TEMPORÁRIO (DEC-INV-UXPT-01 = C, 02 = A, 03 = A). Procedimento, salvaguardas e revogação:
# docs/uxpt/INV-UXPT-01-procedimento.md.
#
# Disparo EXCLUSIVO: push no branch develop que altere ops/inventory/trigger.txt. Esse arquivo NÃO
# existe neste commit de preparação (INV-PREP-01); criá-lo exige autorização expressa e um commit próprio.
#
# Sem configuração administrativa (variáveis INV_UXPT_* do repositório e o ambiente "inv-uxpt-01"),
# o job de validação FALHA antes de qualquer autenticação. Não há credencial alternativa: nenhuma
# chave JSON, nenhum token permanente, nenhuma credencial da Vercel.
#
# As verificações deste YAML COMPLEMENTAM — não substituem — as restrições de IAM (papel somente
# leitura e condição de atributos no provedor de identidade federada).

name: INV-UXPT-01 inventario somente leitura

on:
  push:
    branches:
      - develop
    paths:
      - ops/inventory/trigger.txt

permissions:
  contents: read

concurrency:
  group: inv-uxpt-01
  cancel-in-progress: false

jobs:
  guard:
    name: Validacoes sem credenciais
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validar repositorio, branch, evento e configuracao administrativa
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          FORCED: ${{ github.event.forced }}
          ENABLED: ${{ vars.INV_UXPT_ENABLED }}
          PROJECT: ${{ vars.INV_UXPT_PROJECT }}
          WIF_PROVIDER: ${{ vars.INV_UXPT_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.INV_UXPT_SERVICE_ACCOUNT }}
          APPROVED_BASE: ${{ vars.INV_UXPT_APPROVED_BASE_SHA }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$REPOSITORY" = "rodrigues01martins/sigosc2.0" ] || fail "repositorio nao autorizado"
          [ "$REF" = "refs/heads/develop" ] || fail "branch nao autorizado"
          [ "$EVENT" = "push" ] || fail "evento nao autorizado"
          [ "$FORCED" != "true" ] || fail "push forcado nao e aceito"
          [ "$ENABLED" = "true" ] || fail "inventario nao habilitado administrativamente (INV_UXPT_ENABLED)"
          [ "$PROJECT" = "sigorsc-testes" ] || fail "projeto nao configurado ou diferente de sigorsc-testes (INV_UXPT_PROJECT)"
          [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]] || fail "provedor de identidade federada ausente ou invalido (INV_UXPT_WIF_PROVIDER)"
          [[ "$SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@sigorsc-testes\.iam\.gserviceaccount\.com$ ]] || fail "conta de servico ausente ou fora do projeto (INV_UXPT_SERVICE_ACCOUNT)"
          [[ "$APPROVED_BASE" =~ ^[0-9a-f]{40}$ ]] || fail "commit revisado nao informado (INV_UXPT_APPROVED_BASE_SHA)"
          echo "Contexto e configuracao administrativa validados."

      - name: Checkout do commit de disparo (sem credenciais persistidas)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validar que o disparo altera somente o arquivo de disparo sobre a base revisada
        env:
          SHA: ${{ github.sha }}
          APPROVED_BASE: ${{ vars.INV_UXPT_APPROVED_BASE_SHA }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$SHA" ] || fail "checkout diferente do commit de disparo"
          [ "$(git rev-list --parents -n 1 HEAD | wc -w)" = "2" ] || fail "commit de disparo deve ter exatamente um pai (sem merge)"
          [ "$(git rev-parse HEAD^)" = "$APPROVED_BASE" ] || fail "o commit de disparo nao parte do commit revisado"
          [ "$(git diff --name-only HEAD^ HEAD)" = "ops/inventory/trigger.txt" ] || fail "o commit de disparo altera outros arquivos"
          echo "Commit de disparo validado."

  inventory:
    name: Inventario agregado somente leitura
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Ambiente com revisores obrigatorios (aprovacao humana) e restrito ao branch develop — configurado
    # no GitHub (Settings > Environments) no INV-PREP-02. Sem ele, o job nao recebe aprovacao.
    environment: inv-uxpt-01
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout do commit validado (sem credenciais persistidas)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Revalidar o commit e a base revisada
        env:
          SHA: ${{ github.sha }}
          APPROVED_BASE: ${{ vars.INV_UXPT_APPROVED_BASE_SHA }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ]
          [ "$(git rev-parse HEAD^)" = "$APPROVED_BASE" ]
          [ "$(git diff --name-only HEAD^ HEAD)" = "ops/inventory/trigger.txt" ]

      - name: Node.js compativel com o projeto
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'

      - name: Dependencias pelo lockfile, sem scripts de instalacao
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Testes offline do inventario (antes de qualquer autenticacao)
        run: node --test scripts/inventory/*.test.mjs

      - name: Autenticacao federada (Workload Identity Federation, sem chave)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.INV_UXPT_WIF_PROVIDER }}
          service_account: ${{ vars.INV_UXPT_SERVICE_ACCOUNT }}
          project_id: sigorsc-testes
          create_credentials_file: true
          export_environment_variables: true

      - name: Inventario agregado (somente leitura)
        env:
          INV_UXPT_PROJECT: ${{ vars.INV_UXPT_PROJECT }}
          INV_UXPT_SERVICE_ACCOUNT: ${{ vars.INV_UXPT_SERVICE_ACCOUNT }}
        run: node scripts/inventory/uxpt-legacy-readonly.mjs --out "$RUNNER_TEMP/inv-uxpt-01"

      - name: Conferir conteudo do artefato (somente os dois relatorios agregados)
        run: |
          set -euo pipefail
          [ "$(ls -1 "$RUNNER_TEMP/inv-uxpt-01" | sort | tr '\n' ' ')" = "report.json report.md " ]

      - name: Publicar relatorio agregado (retencao curta)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inv-uxpt-01-aggregate
          path: ${{ runner.temp }}/inv-uxpt-01/
          if-no-files-found: error
          retention-days: 3
